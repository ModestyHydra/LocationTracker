<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DualSync - Realtime Couple Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .dark-glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="bg-gradient-to-br from-rose-500 via-purple-600 to-indigo-800 min-h-screen text-slate-800 flex flex-col items-center justify-center p-4">

    <!-- LOGIN GATEWAY -->
    <div id="login-screen" class="w-full max-w-md dark-glass p-8 rounded-3xl shadow-2xl border border-white/10 text-white text-center">
        <div class="mb-6">
            <span class="text-4xl">❤️🗺️</span>
            <h1 class="text-3xl font-bold mt-2 bg-gradient-to-r from-rose-400 to-pink-300 bg-clip-text text-transparent">DualSync</h1>
            <p class="text-slate-400 text-sm mt-1">Real-time Location & Speed Partner Radar</p>
        </div>
        <div class="space-y-4 text-left">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Your Name</label>
                <input type="text" id="username" placeholder="e.g. Kaja" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-rose-500 transition">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Room Code (Shared with Partner)</label>
                <input type="text" id="roomcode" placeholder="e.g. lovebirdz2026" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-rose-500 transition">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Speed Limit Alert (km/h)</label>
                <input type="number" id="speedlimit" value="80" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-rose-500 transition">
            </div>
            <button onclick="handleLogin()" class="w-full bg-gradient-to-r from-rose-500 to-pink-600 font-bold py-3.5 rounded-xl shadow-lg hover:opacity-90 active:scale-95 transition mt-2">
                Connect With Partner
            </button>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard" class="hidden w-full max-w-4xl flex flex-col gap-4">
        <!-- Top Bar -->
        <div class="dark-glass p-4 rounded-2xl shadow-xl flex flex-wrap items-center justify-between border border-white/10 text-white">
            <div class="flex items-center gap-3">
                <div class="w-3 h-3 bg-emerald-500 rounded-full animate-ping"></div>
                <h2 class="font-bold text-lg" id="welcome-banner">Connected</h2>
            </div>
            <div class="flex items-center gap-3">
                <span id="speed-limit-badge" class="text-xs bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">Limit: 80 km/h</span>
                <button onclick="triggerManualAlert()" class="bg-rose-500 hover:bg-rose-600 text-white font-semibold text-xs px-4 py-2 rounded-xl shadow-lg active:scale-95 transition flex items-center gap-1.5">
                    🚨 Notify Partner
                </button>
            </div>
        </div>

        <!-- Metrics Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- My Status Card -->
            <div class="dark-glass p-5 rounded-2xl shadow-xl border border-white/10 text-white flex flex-col justify-between">
                <div>
                    <span class="text-xs uppercase font-bold text-slate-400 tracking-wider">Your Live Telemetry</span>
                    <h3 id="my-name-display" class="text-xl font-bold text-rose-400 mt-0.5">You</h3>
                </div>
                <div class="flex items-baseline justify-between mt-6">
                    <div>
                        <span id="my-speed" class="text-4xl font-black">0</span>
                        <span class="text-slate-400 text-sm ml-1">km/h</span>
                    </div>
                    <div id="my-speed-warning" class="hidden text-xs bg-red-500/20 text-red-400 border border-red-500/40 px-3 py-1.5 rounded-lg font-semibold animate-pulse">
                        ⚠️ Over Speed Limit!
                    </div>
                </div>
            </div>

            <!-- Partner Status Card -->
            <div class="dark-glass p-5 rounded-2xl shadow-xl border border-white/10 text-white flex flex-col justify-between">
                <div>
                    <span class="text-xs uppercase font-bold text-slate-400 tracking-wider">Partner's Live Telemetry</span>
                    <h3 id="partner-name-display" class="text-xl font-bold text-pink-400 mt-0.5">Waiting for partner...</h3>
                </div>
                <div class="flex items-baseline justify-between mt-6">
                    <div>
                        <span id="partner-speed" class="text-4xl font-black">0</span>
                        <span class="text-slate-400 text-sm ml-1">km/h</span>
                    </div>
                    <div id="partner-alert-box" class="hidden text-xs bg-amber-500/20 text-amber-300 border border-amber-500/40 px-3 py-1.5 rounded-lg font-semibold animate-bounce">
                        🚨 Partner Notified You!
                    </div>
                </div>
            </div>
        </div>

        <!-- Map Section -->
        <div class="dark-glass p-3 rounded-2xl shadow-xl border border-white/10 overflow-hidden">
            <div id="map" class="w-full h-96 rounded-xl z-0"></div>
        </div>
    </div>

    <!-- Firebase SDKs & Script Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // PASTE YOUR FIREBASE CONFIGURATION HERE:
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "https://location-tracker-5085a-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentUser = "";
        let roomCode = "";
        let speedLimit = 80;
        let map, myMarker, partnerMarker;
        let lastLat = null, lastLng = null, lastTime = null;

        window.handleLogin = function() {
            currentUser = document.getElementById('username').value.trim();
            roomCode = document.getElementById('roomcode').value.trim();
            speedLimit = parseFloat(document.getElementById('speedlimit').value) || 80;

            if(!currentUser || !roomCode) {
                alert("Please enter both your name and a room code!");
                return;
            }

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('welcome-banner').innerText = `Room: ${roomCode} | Logged in as ${currentUser}`;
            document.getElementById('speed-limit-badge').innerText = `Limit: ${speedLimit} km/h`;
            document.getElementById('my-name-display').innerText = currentUser;

            initMap();
            startTracking();
            listenToPartner();
        }

        function initMap() {
            map = L.map('map').setView([3.139, 101.686], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            myMarker = L.marker([3.139, 101.686]).addTo(map).bindPopup("You are here");
            partnerMarker = L.marker([3.139, 101.686]).addTo(map).bindPopup("Partner is here");
        }

        function startTracking() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(position => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const currentTime = Date.now();
                    
                    let speedKmh = 0;
                    if (lastLat !== null && lastLng !== null && lastTime !== null) {
                        const distanceMeters = getDistanceFromLatLonInKm(lastLat, lastLng, lat, lng) * 1000;
                        const timeSeconds = (currentTime - lastTime) / 1000;
                        if(timeSeconds > 0) {
                            const speedMs = distanceMeters / timeSeconds;
                            speedKmh = Math.round(speedMs * 3.6);
                        }
                    }

                    lastLat = lat;
                    lastLng = lng;
                    lastTime = currentTime;

                    document.getElementById('my-speed').innerText = speedKmh;
                    myMarker.setLatLng([lat, lng]);
                    
                    const warningEl = document.getElementById('my-speed-warning');
                    if (speedKmh > speedLimit) {
                        warningEl.classList.remove('hidden');
                    } else {
                        warningEl.classList.add('hidden');
                    }

                    const userKey = currentUser.replace(/[.#$[\]]/g, "_");
                    set(ref(db, `rooms/${roomCode}/${userKey}`), {
                        name: currentUser,
                        lat: lat,
                        lng: lng,
                        speed: speedKmh,
                        alert: false,
                        timestamp: currentTime
                    });

                }, error => {
                    console.error("GPS Error: ", error);
                }, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
            } else {
                alert("Geolocation is not supported by your browser");
            }
        }

        function listenToPartner() {
            const roomRef = ref(db, `rooms/${roomCode}`);
            onValue(roomRef, snapshot => {
                const data = snapshot.val();
                if (!data) return;

                let partnerFound = false;
                Object.keys(data).forEach(key => {
                    const userData = data[key];
                    if (userData.name !== currentUser) {
                        partnerFound = true;
                        document.getElementById('partner-name-display').innerText = userData.name;
                        document.getElementById('partner-speed').innerText = userData.speed || 0;
                        
                        partnerMarker.setLatLng([userData.lat, userData.lng]);

                        const alertBox = document.getElementById('partner-alert-box');
                        if (userData.alert) {
                            alertBox.classList.remove('hidden');
                        } else {
                            alertBox.classList.add('hidden');
                        }
                    }
                });

                if(!partnerFound) {
                    document.getElementById('partner-name-display').innerText = "Waiting for partner to join...";
                }
            });
        }

        window.triggerManualAlert = function() {
            const userKey = currentUser.replace(/[.#$[\]]/g, "_");
            update(ref(db, `rooms/${roomCode}/${userKey}`), {
                alert: true
            });
            setTimeout(() => {
                update(ref(db, `rooms/${roomCode}/${userKey}`), {
                    alert: false
                });
            }, 4000);
            alert("Alert sent to your partner!");
        }

        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = deg2rad(lat2-lat1);
            const dLon = deg2rad(lon2-lon1);
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * 
                Math.sin(dLon/2) * Math.sin(dLon/2); 
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
            return R * c;
        }

        function deg2rad(deg) {
            return deg * (Math.PI / 180);
        }
    </script>
</body>
</html>
